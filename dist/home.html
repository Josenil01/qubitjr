<div class="frame" id="frame">

			</li>
			<div></div>
		</ul>
        <ul class="reference" id="settings">
            <div></div>
            <li class="gear" id="geartab">
                <span class="gear-icon"></span>
            </li>
       </ul>

			</li>
	 </ul>
	</div>

			<span id="subtitle"></span>

</div>

<!-- === Modal: Nomear Novo Projeto === -->
<div id="sjr-naming-modal" class="hidden">
    <div id="sjr-naming-backdrop"></div>
    <div id="sjr-naming-box">
        <p id="sjr-naming-title">Como vai se chamar seu projeto? 🎨</p>
        <input
            type="text"
            id="sjr-naming-input"
            maxlength="40"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="Nome do projeto"
        />
        <div id="sjr-naming-buttons">
            <button id="sjr-naming-cancel">Cancelar</button>
            <button id="sjr-naming-confirm">Criar! 🌟</button>
        </div>
    </div>
</div>

<!-- === Modal: Limite Diário === -->
<div id="sjr-daily-limit-modal" class="hidden">
    <div id="sjr-daily-limit-backdrop"></div>
    <div id="sjr-daily-limit-box">
        <div id="sjr-daily-limit-icon">⏰</div>
        <p id="sjr-daily-limit-text"></p>
        <button id="sjr-daily-limit-ok">OK</button>
    </div>
</div>

</body>
